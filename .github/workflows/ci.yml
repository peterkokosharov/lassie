name: ci

on:
  push:
  pull_request:

# TODO: pin the actions below to full commit SHAs (tag kept as a comment); the SHAs could not be looked up offline.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install pytest==9.2.0
      - name: All suites (pytest, header check) and test-results.txt
        run: python tools/run_tests.py
      - name: Upload test-results.txt
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.txt
